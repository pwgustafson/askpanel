[project]
name = "askpanel"
version = "0.1.1"
description = "In-app help chat and guided feature requests, grounded only in a markdown corpus you write."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Paul Gustafson" }]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "anthropic>=0.40",
]
keywords = ["help", "chat", "fastapi", "anthropic", "feedback"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
# `askpanel serve-demo` needs an ASGI server.
demo = ["uvicorn>=0.23"]

[project.scripts]
askpanel = "askpanel.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",   # Starlette's TestClient transport
  "ruff>=0.5",
  "uvicorn>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askpanel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
